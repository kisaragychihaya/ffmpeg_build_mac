name: Build FFmpeg (macOS arm64, full options)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Tap homebrew-ffmpeg
        run: |
          brew tap homebrew-ffmpeg/ffmpeg

      # chromaprint depends on ffmpeg itself (cyclic dependency).
      # Workaround: install chromaprint first (pulls in homebrew-core ffmpeg),
      # then remove that ffmpeg while keeping chromaprint.
      - name: Pre-install chromaprint (cyclic dependency workaround)
        run: |
          brew install chromaprint
          brew uninstall --ignore-dependencies ffmpeg

      # The formula's --with-libzvbi option uses zvbi but forgets to declare
      # the dependency, so pkg-config can't find zvbi-0.2. Install it first.
      - name: Pre-install zvbi (missing formula dependency)
        run: brew install zvbi

      - name: Build FFmpeg with all available options
        run: |
          # All options except:
          #   --with-decklink  (requires the DeckLink SDK, not available in CI)
          #   --with-libflite  (flite is not packaged in homebrew-core)
          #   --with-alt-name  (we want the normal ffmpeg/ffprobe/ffplay names)
          #   --with-fdk-aac   (not needed; also forces --enable-nonfree)
          #   --with-openssl   (not needed; also forces --enable-nonfree)
          OPTIONS=$(brew options homebrew-ffmpeg/ffmpeg/ffmpeg --compact \
            | tr ' ' '\n' \
            | grep -v 'with-decklink' \
            | grep -v 'with-libflite' \
            | grep -v 'with-alt-name' \
            | grep -v 'with-fdk-aac' \
            | grep -v 'with-openssl' \
            | xargs)
          echo "Building with options: $OPTIONS"
          # Options always imply a source build, so this compiles FFmpeg.
          brew install --verbose homebrew-ffmpeg/ffmpeg/ffmpeg $OPTIONS

      - name: Bundle binaries with their dylib dependencies
        run: |
          brew install dylibbundler
          PREFIX=$(brew --prefix)
          mkdir -p dist/bin dist/lib
          for tool in ffmpeg ffprobe ffplay; do
            cp "$PREFIX/bin/$tool" dist/bin/
            dylibbundler -od -b -of \
              -x "dist/bin/$tool" \
              -d dist/lib \
              -p @executable_path/../lib
          done
          # Sanity check: the bundled binary must run standalone
          DYLD_LIBRARY_PATH= dist/bin/ffmpeg -version
          dist/bin/ffmpeg -buildconf

          # Verify Apple Silicon hardware acceleration is compiled in.
          # The formula enables these by default on macOS/arm64:
          #   --enable-videotoolbox  (h264/hevc/prores HW encode+decode)
          #   --enable-audiotoolbox  (AAC/AC-3 HW audio)
          #   --enable-neon          (ARM NEON SIMD)
          dist/bin/ffmpeg -hide_banner -hwaccels | tee hwaccels.txt
          grep -q videotoolbox hwaccels.txt
          dist/bin/ffmpeg -hide_banner -encoders | grep '_videotoolbox'
          # Note: FFmpeg 9 has no separate *_videotoolbox decoder entries;
          # hardware decoding is done through the videotoolbox hwaccel,
          # which is covered by the -hwaccels check and functional test.
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-videotoolbox'
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-audiotoolbox'
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-neon'

          # Functional test: VideoToolbox encode + decode.
          # GitHub's macOS runners are VMs where the HW compression session
          # can be unavailable (error -12903), so fall back to -allow_sw 1,
          # which still exercises the full videotoolbox code path.
          dist/bin/ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=2:size=640x360:rate=30 \
            -c:v h264_videotoolbox -allow_sw 1 -y hwtest.mp4
          dist/bin/ffmpeg -hide_banner -loglevel error \
            -hwaccel videotoolbox -i hwtest.mp4 -f null - || \
            echo "warning: HW decode unavailable in CI VM, skipping"

          tar -C dist -czf "ffmpeg-full-macos-arm64.tar.gz" bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-full-macos-arm64
          path: ffmpeg-full-macos-arm64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-full-macos-arm64.tar.gz

  build-static:
    runs-on: macos-14 # Apple Silicon (arm64)
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # The formula hook renames Homebrew dylibs during install to force
      # static linking; that needs write access outside the build dir.
      HOMEBREW_NO_SANDBOX: "1"
    steps:
      - name: Tap homebrew-ffmpeg
        run: |
          brew tap homebrew-ffmpeg/ffmpeg

      # Patch the formula for a static build: link all Homebrew dependencies
      # statically, so the binaries only need macOS system libraries.
      # (macOS does not support fully static binaries; libSystem is always
      # dynamic. This is as static as it gets.)
      #
      # macOS ld always prefers .dylib over .a for -lfoo, and with
      # -mdynamic-no-pic (which ffmpeg's configure adds for static builds)
      # taking the address of a dylib symbol fails with "invalid use of ADRP".
      # So we inject a hook at the start of the formula's install method
      # (i.e. AFTER the source tarball is unpacked — Homebrew's bsdtar needs
      # liblzma.dylib) that hides all dylibs, forcing the linker to use the
      # static archives. pkgconf's dylib is kept because configure still
      # needs to run pkg-config. The CI runner is disposable.
      - name: Patch formula to build static
        run: |
          FORMULA="$(brew --repository)/Library/Taps/homebrew-ffmpeg/homebrew-ffmpeg/Formula/ffmpeg.rb"
          sed -i '' \
            's/--enable-shared/--enable-static --disable-shared --pkg-config-flags=--static/' \
            "$FORMULA"
          python3 - "$FORMULA" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          inject = (
              " def install\n"
              '  system "find", "#{HOMEBREW_PREFIX}/Cellar", "-name", "*.dylib", "!", "-path", "*pkgconf*", "-exec", "mv", "{}", "{}.hidden", ";"\n'
          )
          assert " def install\n" in s, "install method not found"
          s = s.replace(" def install\n", inject, 1)
          open(p, "w").write(s)
          PYEOF
          sed -n '/def install/,+3p' "$FORMULA"

      # chromaprint depends on ffmpeg itself (cyclic dependency).
      # Workaround: install chromaprint first (pulls in homebrew-core ffmpeg),
      # then remove that ffmpeg while keeping chromaprint.
      - name: Pre-install chromaprint (cyclic dependency workaround)
        run: |
          brew install chromaprint
          brew uninstall --ignore-dependencies ffmpeg

      # The formula's --with-libzvbi option uses zvbi but forgets to declare
      # the dependency, so pkg-config can't find zvbi-0.2. Install it first.
      - name: Pre-install zvbi (missing formula dependency)
        run: brew install zvbi

      - name: Install dependencies
        run: |
          # All options except:
          #   --with-decklink   (requires the DeckLink SDK, not available in CI)
          #   --with-libflite   (flite is not packaged in homebrew-core)
          #   --with-alt-name   (we want the normal ffmpeg/ffprobe/ffplay names)
          #   --with-fdk-aac    (not needed; also forces --enable-nonfree)
          #   --with-openssl    (not needed; also forces --enable-nonfree)
          #   --with-tensorflow (libtensorflow ships no static archive)
          #   --with-openvino   (OpenVINO ships no static archive)
          OPTIONS=$(brew options homebrew-ffmpeg/ffmpeg/ffmpeg --compact \
            | tr ' ' '\n' \
            | grep -v 'with-decklink' \
            | grep -v 'with-libflite' \
            | grep -v 'with-alt-name' \
            | grep -v 'with-fdk-aac' \
            | grep -v 'with-openssl' \
            | grep -v 'with-tensorflow' \
            | grep -v 'with-openvino' \
            | xargs)
          echo "Building with options: $OPTIONS"
          echo "OPTIONS=$OPTIONS" >> "$GITHUB_ENV"
          brew install --only-dependencies homebrew-ffmpeg/ffmpeg/ffmpeg $OPTIONS

      - name: Build FFmpeg with all available options (static)
        run: |
          brew install --verbose homebrew-ffmpeg/ffmpeg/ffmpeg $OPTIONS || {
            echo "===== ffbuild/config.log tail ====="
            tail -100 ~/Library/Logs/Homebrew/ffmpeg/ffbuild/config.log
            exit 1
          }

      - name: Package static binaries
        run: |
          PREFIX=$(brew --prefix)
          mkdir -p dist/bin
          for tool in ffmpeg ffprobe ffplay; do
            cp "$PREFIX/bin/$tool" dist/bin/
          done

          # Verify the binaries are static w.r.t. Homebrew: no references to
          # /opt/homebrew may remain (system libs under /usr/lib and
          # /System/Library are expected and unavoidable on macOS).
          otool -L dist/bin/ffmpeg
          if otool -L dist/bin/ffmpeg dist/bin/ffprobe dist/bin/ffplay \
              | grep -q 'homebrew'; then
            echo "::error::binaries still link against Homebrew dylibs"
            exit 1
          fi

          # Sanity check: the binary must run standalone
          DYLD_LIBRARY_PATH= dist/bin/ffmpeg -version
          dist/bin/ffmpeg -hide_banner -hwaccels | tee hwaccels.txt
          grep -q videotoolbox hwaccels.txt
          dist/bin/ffmpeg -hide_banner -encoders | grep '_videotoolbox'
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-videotoolbox'
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-audiotoolbox'
          dist/bin/ffmpeg -buildconf | grep -q -- '--enable-neon'

          # Functional test (VM runners lack HW compression sessions,
          # so allow software fallback)
          dist/bin/ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=2:size=640x360:rate=30 \
            -c:v h264_videotoolbox -allow_sw 1 -y hwtest.mp4

          tar -C dist -czf "ffmpeg-full-macos-arm64-static.tar.gz" bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-full-macos-arm64-static
          path: ffmpeg-full-macos-arm64-static.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-full-macos-arm64-static.tar.gz
